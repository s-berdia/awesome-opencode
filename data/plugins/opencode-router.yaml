name: opencode-router
repo: https://github.com/s-berdia/Opencode_router
tagline: Best model for each agent on OpenCode Go, Go Plus, or Free, with a free-model fallback before you hit the usage limit
description: Scores every model in your OpenCode catalog for each agent (plan, build, general, explore) and for the internal helpers, from intelligence, speed, and how fast the model uses your Go allowance. All Go models share one usage allowance. The router estimates its use, and at 85% (or after a usage-limit error) it moves the agents to a free model, then back when the use falls. After a rate-limit error of one model, it moves the agent to the next model in its list. Includes the /refresh-routing, /routing-status, /routing-plan, and /routing-update slash commands, a command-line tool, and an update checker. Install with `opencode plugin @s-berdia/opencode-router --global`.
scope:
  - global
  - project
tags:
  - routing
  - failover
  - rate-limit
  - opencode-go
  - multi-model
